      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${NACOS_HOST:-127.0.0.1}
      - SERVER_SHUTDOWN=graceful
      - SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=30s
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - HEALTH_CHECK_PORT=60002
      - HEALTH_CHECK_CONTEXT=/system
      - HEALTH_CHECK_START_DELAY=50
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,prometheus,metrics,info
      - MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS=when-authorized
      - TZ=Asia/Shanghai
    volumes:
      - ./system-service/target:/app/target:ro
      - ./keys:/work/elink-ai/elink-work/keys:ro
    command: ["java", "-Xms512m", "-Xmx512m", "-XX:MetaspaceSize=128m", "-XX:MaxMetaspaceSize=256m", "-XX:+UseG1GC", "-XX:MaxGCPauseMillis=200", "-XX:+HeapDumpOnOutOfMemoryError", "-XX:HeapDumpPath=/app/logs/", "-jar", "target/system-service-exec.jar"]
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - elink-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:60002/system/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 50s

  device-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: elink-base:latest
    container_name: device-service
    env_file:
      - .env
    ports:
