version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456} --appendonly yes --appendfsync everysec --save 900 1 --save 300 10 --save 60 10000
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - elink-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  emqx1:
    image: emqx/emqx:5.1.0
    container_name: emqx1
    environment:
      - EMQX_NAME=emqx1
      - EMQX_LOADED_MODULES=emqx_mod_acl_internal,emqx_mod_presence
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=public
      - EMQX_CLUSTER__DISCOVERY_STRATEGY=static
      - EMQX_CLUSTER__STATIC__SEEDS=[emqx1,emqx2]
      - EMQX_NODE__COOKIE=elink_emqx_cluster_cookie
      - TZ=Asia/Shanghai
    ports:
      - "1883:1883"
      - "18083:18083"
    networks:
      - elink-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  emqx2:
    image: emqx/emqx:5.1.0
    container_name: emqx2
    environment:
      - EMQX_NAME=emqx2
      - EMQX_LOADED_MODULES=emqx_mod_acl_internal,emqx_mod_presence
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=public
      - EMQX_LISTENERS__TCP__DEFAULT__BIND=2883
      - EMQX_DASHBOARD__HTTP_PORT=28083
      - EMQX_CLUSTER__DISCOVERY_STRATEGY=static
      - EMQX_CLUSTER__STATIC__SEEDS=[emqx1,emqx2]
      - EMQX_NODE__COOKIE=elink_emqx_cluster_cookie
      - TZ=Asia/Shanghai
    ports:
      - "2883:2883"
      - "28083:28083"
    networks:
      - elink-network
    restart: always
    depends_on:
      emqx1:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nacos:
    image: nacos/nacos-server:v2.1.0
    container_name: nacos
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=${MYSQL_HOST:-192.168.2.158}
      - MYSQL_SERVICE_PORT=${MYSQL_PORT:-3306}
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=${MYSQL_USERNAME:-root}
      - MYSQL_SERVICE_PASSWORD=${MYSQL_PASSWORD:-sm@123456}
      - JVM_XMS=256m
      - JVM_XMX=512m
      - JVM_XMN=256m
      - TZ=Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-logs:/home/nacos/logs
    networks:
      - elink-network
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: elink-base:latest
    container_name: auth-service
    env_file:
      - ../.env
    ports:
      - "60001:60001"
    environment:
      - NACOS_HOST=${NACOS_HOST:-127.0.0.1}
      - NACOS_PORT=${NACOS_PORT:-8848}
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${NACOS_HOST:-127.0.0.1}
      - SERVER_SHUTDOWN=graceful
      - SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=30s
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - HEALTH_CHECK_PORT=60001
      - HEALTH_CHECK_CONTEXT=/sauth
      - HEALTH_CHECK_START_DELAY=50
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health
      - MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS=never
      - TZ=Asia/Shanghai
    volumes:
      - ./auth-service/target:/app/target:ro
    command: ["java", "-Xms512m", "-Xmx512m", "-XX:MetaspaceSize=128m", "-XX:MaxMetaspaceSize=256m", "-XX:+UseParallelGC", "-XX:+HeapDumpOnOutOfMemoryError", "-XX:HeapDumpPath=/app/logs/", "-jar", "target/auth-service-exec.jar"]
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - elink-network
    restart: on-failure:3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:60001/sauth/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s

  sunmax-gateway:
    build:
