    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:60010/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s

networks:
  elink-network:
    driver: bridge

volumes:
  redis-data:
