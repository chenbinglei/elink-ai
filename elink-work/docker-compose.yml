      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - WAIT_FOR_SERVICE=together-service
      - WAIT_MAX_RETRIES=60
      - TZ=Asia/Shanghai
      - LD_LIBRARY_PATH=/usr/lib:/usr/local/taos/driver
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2
    volumes:
      - ./crontab-service/target:/app/target:ro
      - /usr/lib/libtaos.so.1:/usr/lib/libtaos.so.1:ro
      - /usr/local/taos/driver/libtaos.so.3.0.7.1:/usr/local/taos/driver/libtaos.so.3.0.7.1:ro
      - /etc/taos/taos.cfg:/etc/taos/taos.cfg:ro
    command: ["java", "-Xms512m", "-Xmx512m", "-XX:MetaspaceSize=128m", "-XX:MaxMetaspaceSize=256m", "-XX:+UseParallelGC", "-jar", "target/scrontab-service-exec.jar"]
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      together-service:
        condition: service_started
    networks:
      - elink-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:60006/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 40s

  devops-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: elink-base:latest
    container_name: devops-service
    env_file:
      - /work/elink-ai/.env
    ports:
      - "60007:60007"
    environment:
