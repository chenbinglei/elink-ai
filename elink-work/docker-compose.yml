          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:60009/together/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s

  webapp-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: elink-base:latest
    container_name: webapp-service
    env_file:
      - ../.env
    ports:
      - "60010:60010"
    environment:
      - NACOS_HOST=${NACOS_HOST:-127.0.0.1}
      - NACOS_PORT=${NACOS_PORT:-8848}
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${NACOS_HOST:-127.0.0.1}
      - SERVER_SHUTDOWN=graceful
      - SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=30s
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - HEALTH_CHECK_PORT=60010
      - HEALTH_CHECK_CONTEXT=/swebapp
      - HEALTH_CHECK_START_DELAY=50
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health
      - MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS=never
      - TZ=Asia/Shanghai
    volumes:
      - ./webapp-service/target:/app/target:ro
    command: ["java", "-Xms512m", "-Xmx512m", "-XX:MetaspaceSize=128m", "-XX:MaxMetaspaceSize=256m", "-XX:+UseG1GC", "-XX:MaxGCPauseMillis=200", "-XX:+HeapDumpOnOutOfMemoryError", "-XX:HeapDumpPath=/app/logs/", "-jar", "target/webapp-service-exec.jar"]
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - elink-network
    restart: on-failure:3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:60010/swebapp/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s

networks:
  elink-network:
    driver: bridge

volumes:
  redis-data:
  nacos-logs:
