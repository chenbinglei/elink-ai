      dockerfile: Dockerfile
    image: elink-base:latest
    container_name: sunmax-gateway
    env_file:
      - ../.env
    ports:
      - "5000:5000"
    environment:
      - NACOS_HOST=${NACOS_HOST:-127.0.0.1}
      - NACOS_PORT=${NACOS_PORT:-8848}
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${NACOS_HOST:-127.0.0.1}
      - SERVER_SHUTDOWN=graceful
      - SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=30s
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - HEALTH_CHECK_PORT=5000
      - HEALTH_CHECK_CONTEXT=/
      - HEALTH_CHECK_START_DELAY=40
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health
      - MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS=never
      - TZ=Asia/Shanghai
    volumes:
      - ./sunmax-gateway/target:/app/target:ro
    command: ["java", "-Xms256m", "-Xmx256m", "-XX:MetaspaceSize=128m", "-XX:MaxMetaspaceSize=256m", "-XX:+UseSerialGC", "-XX:+HeapDumpOnOutOfMemoryError", "-XX:HeapDumpPath=/app/logs/", "-jar", "target/sunmax-gateway-exec.jar"]
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - elink-network
    restart: on-failure:3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s

  system-service:
