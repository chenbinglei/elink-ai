  webapp-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: elink-base:latest
    container_name: webapp-service
    env_file:
      - /work/elink-ai/.env
    ports:
      - "60010:60010"
    environment:
      - NACOS_HOST=${NACOS_HOST:-127.0.0.1}
      - NACOS_PORT=${NACOS_PORT:-8848}
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${NACOS_HOST:-127.0.0.1}
