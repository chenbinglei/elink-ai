    command: ["java", "-Xms512m", "-Xmx512m", "-XX:MetaspaceSize=128m", "-XX:MaxMetaspaceSize=256m", "-XX:+UseParallelGC", "-jar", "target/devops-service-exec.jar"]
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - elink-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:60007/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s

  configure-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: elink-base:latest
    container_name: configure-service
    env_file:
      - /work/elink-ai/.env
    ports:
      - "60008:60008"
    environment:
      - NACOS_HOST=${NACOS_HOST:-127.0.0.1}
      - NACOS_PORT=${NACOS_PORT:-8848}
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${NACOS_HOST:-127.0.0.1}
      - SERVER_SHUTDOWN=graceful
      - SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=30s
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - TZ=Asia/Shanghai
    volumes:
      - ./configure-service/target:/app/target:ro
    command: ["java", "-Xms512m", "-Xmx512m", "-XX:MetaspaceSize=128m", "-XX:MaxMetaspaceSize=256m", "-XX:+UseParallelGC", "-jar", "target/configure-service-exec.jar"]
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx1:
        condition: service_healthy
    networks:
      - elink-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:60008/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s

  together-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: elink-base:latest
    container_name: together-service
    env_file:
      - /work/elink-ai/.env
    ports:
      - "60009:60009"
    environment:
      - NACOS_HOST=${NACOS_HOST:-127.0.0.1}
      - NACOS_PORT=${NACOS_PORT:-8848}
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${NACOS_HOST:-127.0.0.1}
      - SERVER_SHUTDOWN=graceful
      - SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=30s
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - TZ=Asia/Shanghai
    volumes:
      - ./together-service/target:/app/target:ro
    command: ["java", "-Xms512m", "-Xmx512m", "-XX:MetaspaceSize=128m", "-XX:MaxMetaspaceSize=256m", "-XX:+UseParallelGC", "-jar", "target/together-service-exec.jar"]
    depends_on:
      nacos:
        condition: service_healthy
      redis:
