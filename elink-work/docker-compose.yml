version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - elink-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # WARNING: 生产环境必须通过 .env 覆盖 EMQX_ADMIN_USER 和 EMQX_ADMIN_PASSWORD
  emqx1:
    image: emqx/emqx:5.1.0
    container_name: emqx1
    environment:
      - EMQX_NAME=emqx1
      - EMQX_NODE_NAME=emqx1@127.0.0.1
      - EMQX_DASHBOARD_DEFAULT_USERNAME=${EMQX_ADMIN_USER:-admin}
      - EMQX_DASHBOARD_DEFAULT_PASSWORD=${EMQX_ADMIN_PASSWORD:-public}
      - TZ=Asia/Shanghai
    ports:
      - "1883:1883"
      - "18083:18083"
    networks:
      - elink-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  emqx2:
    image: emqx/emqx:5.1.0
    container_name: emqx2
    environment:
      - EMQX_NAME=emqx2
      - EMQX_NODE_NAME=emqx2@127.0.0.1
      - EMQX_DASHBOARD_DEFAULT_USERNAME=${EMQX_ADMIN_USER:-admin}
      - EMQX_DASHBOARD_DEFAULT_PASSWORD=${EMQX_ADMIN_PASSWORD:-public}
      - TZ=Asia/Shanghai
    ports:
      - "2883:1883"
      - "28083:18083"
    networks:
      - elink-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # WARNING: 生产环境必须通过 .env 覆盖 NACOS_USERNAME 和 NACOS_PASSWORD
  nacos:
    image: nacos/nacos-server:v2.1.0
    container_name: nacos
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=512m
      - JVM_XMN=256m
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - TZ=Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - elink-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: elink-base:latest
    container_name: auth-service
    env_file:
      - .env
    ports:
      - "60001:60001"
    environment:
      - REDIS_HOST=redis
      - NACOS_HOST=nacos
      - NACOS_PORT=${NACOS_PORT:-8848}
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${NACOS_HOST:-127.0.0.1}
      - SERVER_SHUTDOWN=graceful
      - SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=30s
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - HEALTH_CHECK_PORT=60001
      - HEALTH_CHECK_CONTEXT=/sauth
      - HEALTH_CHECK_START_DELAY=50
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,prometheus,metrics,info
      - MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS=when-authorized
      - TZ=Asia/Shanghai
      - JWT_ENABLED=${JWT_ENABLED:-false}
    volumes:
      - ./auth-service/target:/app/target:ro
      - ./keys:/work/elink-ai/elink-work/keys:ro
    command: ["java", "-Xms512m", "-Xmx512m", "-XX:MetaspaceSize=128m", "-XX:MaxMetaspaceSize=256m", "-XX:+UseG1GC", "-XX:MaxGCPauseMillis=200", "-XX:+HeapDumpOnOutOfMemoryError", "-XX:HeapDumpPath=/app/logs/", "-jar", "target/auth-service-exec.jar"]
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - elink-network
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:60001/sauth/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 50s

  sunmax-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: elink-base:latest
    container_name: sunmax-gateway
    env_file:
      - .env
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - NACOS_HOST=nacos
      - NACOS_PORT=${NACOS_PORT:-8848}
      - SERVER_SHUTDOWN=graceful
      - SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=30s
      - SPRING_MAIN_LAZY_INITIALIZATION=false
      - HEALTH_CHECK_PORT=5000
      - HEALTH_CHECK_CONTEXT=
      - HEALTH_CHECK_START_DELAY=60
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,prometheus,metrics,info
      - MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS=when-authorized
      - TZ=Asia/Shanghai
    volumes:
      - ./sunmax-gateway/target:/app/target:ro
    command: ["java", "-Xms512m", "-Xmx512m", "-XX:MetaspaceSize=128m", "-XX:MaxMetaspaceSize=256m", "-XX:+UseG1GC", "-XX:MaxGCPauseMillis=200", "-XX:+HeapDumpOnOutOfMemoryError", "-XX:HeapDumpPath=/app/logs/", "-jar", "target/sunmax-gateway-exec.jar"]
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - elink-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  system-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: elink-base:latest
    container_name: system-service
    env_file:
      - .env
    ports:
      - "60002:60002"
    environment:
