server:
  port: 60008
  servlet:
    context-path: /configure
file:
  file-path: /opt/sunos/file
  image-path: /opt/sunos/image

spring:
  main:
    allow-bean-definition-overriding: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  resources:
    static-locations: file:${file.file-path},file:${file.image-path}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${NACOS_HOST:192.168.2.155}:13006/sunos-configure?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: ${MYSQL_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource
    # 配置监控统计拦截的filters，去掉后监控界面SQL无法进行统计，’wall’用于防火墙
    filters: stat,wall,config
    # 最大连接数
    maxActive: 100
    # 初始化大小
    initial-size: 5
    # 获取连接等待超时时间
    max-wait: 60000
    # 最小连接数
    min-idle: 5
    # 间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
    time-between-eviction-runs-millis: 600000
    # 一个连接在池中最小生存的时间，单位是毫秒
    min-evictable-idle-time-millis: 30000
    validation-query: select 1
    # 申请连接的时候检测，建议配置为true，不影响性能，并且保证安
    test-while-idle: true
    # 获取连接时执行检测，建议关闭，影响性能
    test-on-borrow: false
    # 归还连接时执行检测，建议关闭，影响性能
    test-on-return: false
    # 是否开启PSCache，PSCache对支持游标的数据库性能提升巨大，oracle建议开启，mysql下建议关闭
    pool-prepared-statements: false
    # 开启poolPreparedStatements后生效
    max-pool-prepared-statement-per-connection-size: 20
    pool-name: primarypool

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL55Dialect
        order_inserts: true
        order_updates: true
        generate_statistics: true         #生成统计信息
        jdbc.batch_size: 50                #开启批次储存,一批次储存量为10,如有100条数据则储存十次

  redis:
    port: 6379
    host: ${NACOS_HOST:192.168.2.155}
    password: ${REDIS_PASSWORD}
    timeout: 60s
    database: 1
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 10
        # 连接池中的最大空闲连接
        max-idle: 100
        # 连接池的最大数据库连接数
        max-active: 200
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: 1000
mybatis:
  typeAliasesPackage: com.taosdata.jdbc.springbootdemo.domain
  call-setters-on-nulls: true #设置查询字段为空时，也返回该字段
  map-underscore-to-camel-case: true

security:
  oauth2:
    client:
      client-id: sunos-client
      client-secret: sunos-client
      access-token-uri: http://localhost:60001/sauth/oauth/token
      user-authorization-uri: http://localhost:60001/sauth/oauth/authorize
    resource:
      token-info-uri: http://localhost:60001/sauth/oauth/check_token

#MQTT配置信息
mqtt:
  #qos 可取值ֵ0 1 2
  qos: 2
  timeout: 60
  keep-alive: 60
  expire: 5 #过期时间
  web:
    username: admin
    password: ${EMQX_PASSWORD}
    host-url: tcp://${NACOS_HOST:192.168.2.155}:1883
    client-id: emqx${random.value}
    client-topic: webTopic

