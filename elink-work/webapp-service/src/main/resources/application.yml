server:
  port: 60010
  servlet:
    context-path: /swebapp

spring:
  application:
    name: swebapp-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}
  datasource:
    mysql-server:
      type: com.zaxxer.hikari.HikariDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/sunos-operate?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD}
      hikari:
        minimum-idle: 1
        idle-timeout: 600000
        maximum-pool-size: 10
        auto-commit: true
        pool-name: MyHikariCP
        max-lifetime: 1800000
        connection-timeout: 30000
        connection-test-query: SELECT 1
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL55Dialect
        order_inserts: true
        order_updates: true
        generate_statistics: false
        jdbc.batch_size: 1000

  redis:
    port: ${REDIS_PORT:6379}
    host: ${REDIS_HOST:127.0.0.1}
    password: ${REDIS_PASSWORD}
    timeout: 60s
    database: 1
    lettuce:
      pool:
        min-idle: 10
        max-idle: 100
        max-active: 200
        max-wait: 1000

mybatis:
  type-aliases-package: com.sunmax.webapp.entity
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'

security:
  oauth2:
    client:
      client-id: sunos-client
      client-secret: ${OAUTH2_CLIENT_SECRET:sunos-client}
      access-token-uri: http://${AUTH_HOST:127.0.0.1}:${AUTH_PORT:60001}/sauth/oauth/token
      user-authorization-uri: http://${AUTH_HOST:127.0.0.1}:${AUTH_PORT:60001}/sauth/oauth/authorize
    resource:
      token-info-uri: http://${AUTH_HOST:127.0.0.1}:${AUTH_PORT:60001}/sauth/oauth/check_token

wechatpay:
  payUrl: ${WECHATPAY_PAY_URL}
  refundUrl: ${WECHATPAY_REFUND_URL}
  transferUrl: ${WECHATPAY_TRANSFER_URL}

ribbon:
  ReadTimeout: 60000
  ConnectTimeout: 60000
