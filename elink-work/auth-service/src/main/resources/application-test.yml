server:
  port: 60001
  servlet:
    context-path: /sauth

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${NACOS_HOST:192.168.2.158}:3306/sunos-system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD}
    hikari:
      minimum-idle: 1
      idle-timeout: 600000
      maximum-pool-size: 1000
      auto-commit: true
      pool-name: MyHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL55Dialect

  redis:
    port: 6379
    host: ${NACOS_HOST:192.168.2.158}
    password: ${REDIS_PASSWORD}
    timeout: 60s
    database: 0
    lettuce:
      pool:
        max-active: 200
        max-wait: 1000ms
        max-idle: 50
        min-idle: 10

mybatis:
  type-aliases-package: com.sunmax.auth.entity
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
