global:
  resolve_timeout: 5m
  # 邮件通知配置（按需启用，取消注释并填写实际值）
  # smtp_smarthost: "smtp.example.com:587"
  # smtp_from: "alertmanager@example.com"
  # smtp_auth_username: "alertmanager@example.com"
  # smtp_auth_password: "your-password"
  # smtp_require_tls: true

route:
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: "warning"
      repeat_interval: 4h

receivers:
  - name: "default"
    # Webhook通知（按需配置）
    # webhook_configs:
    #   - url: "http://localhost:5001/alerts"
    #     send_resolved: true

  - name: "critical"
    # 邮件通知（按需启用）
    # email_configs:
    #   - to: "admin@example.com"
    #     send_resolved: true
    # Webhook通知
    # webhook_configs:
    #   - url: "http://localhost:5001/critical"
    #     send_resolved: true

  - name: "warning"
    # 邮件通知（按需启用）
    # email_configs:
    #   - to: "team@example.com"
    #     send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "job"]
