server:
  port: 60009
  servlet:
    context-path: /together

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: smtp.sina.com
    port: 465
    username: invoice_evcharge@sina.com # 你的阿里云企业邮箱
    password: ${OAUTH2_CLIENT_SECRET}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            # 可选：调试模式（生产环境关闭）
            #debug: true
#  mail:
#    host: smtp.qiye.aliyun.com
#    port: 465
#    username: binglei@sunmaxxtech.com # 你的阿里云企业邮箱
#    password: ${OAUTH2_CLIENT_SECRET}
#    protocol: smtp
#    default-encoding: UTF-8
#    properties:
#      mail:
#        smtp:
#          auth: true
#          ssl:
#            enable: true
#          # 可选：调试模式（生产环境关闭）
#            #debug: true
  main:
    allow-bean-definition-overriding: true
  datasource:
    #mysql 数据库配置
    mysql-server:
      type: com.zaxxer.hikari.HikariDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${NACOS_HOST:192.168.2.155}:13006/sunos-operate?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai
      username: root
      password: ${MYSQL_PASSWORD}
      hikari:
        minimum-idle: 1
        idle-timeout: 600000
        maximum-pool-size: 10
        auto-commit: true
        pool-name: MyHikariCP
        max-lifetime: 1800000
        connection-timeout: 30000
        connection-test-query: SELECT 1
    sunos-log:
      type: com.zaxxer.hikari.HikariDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${NACOS_HOST:192.168.2.155}:13006/sunos-log?serverTimezone=GMT%2B8&autoReconnect=true&allowMultiQueries=true&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false
      username: root
      password: ${MYSQL_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL55Dialect
        order_inserts: true
        order_updates: true
        generate_statistics: false         #生成统计信息
        jdbc.batch_size: 1000              #开启批次储存,一批次储存量为1000,如有10000条数据则储存十次

  redis:
    port: 6379
    host: ${NACOS_HOST:192.168.2.155}
    password: ${REDIS_PASSWORD}
    timeout: 60s
    database: 1
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 10
        # 连接池中的最大空闲连接
        max-idle: 100
        # 连接池的最大数据库连接数
        max-active: 200
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: 1000

security:
  oauth2:
    client:
      client-id: derms-client
      client-secret: derms-client
      access-token-uri: http://localhost:60001/sauth/oauth/token
      user-authorization-uri: http://localhost:60001/sauth/oauth/authorize
    resource:
      token-info-uri: http://localhost:60001/sauth/oauth/check_token

