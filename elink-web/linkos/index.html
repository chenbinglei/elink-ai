<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <meta content="0" http-equiv="Expires"/>
    <meta content="no-cache" http-equiv="Pragma"/>
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width,initial-scale=1.0" name="viewport">
    <meta content="no-cache, no-store, must-revalidate" http-equiv="Cache-Control"/>
    <link href="/l7-mapbox/mapbox-gl.css" rel="stylesheet">
    <link href="/favicon.ico" rel="icon">
    <style>
      html, body, #app { height: 100%; margin: 0; }
      html, body { background-color: #F8F8F8; }
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #F8F8F8;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #app-loading .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e4e7ed;
        border-top-color: #409eff;
        border-radius: 50%;
        animation: app-loading-spin 0.8s linear infinite;
      }
      #app-loading .tip {
        margin-top: 16px;
        color: #909399;
        font-size: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      @keyframes app-loading-spin {
        to { transform: rotate(360deg); }
      }

      /* ========== 组织架构页面下拉框宽度修复 ========== */
      .content_table_right .el-select {
        width: 468px !important;
      }
      .content_table_right .el-select .el-select__wrapper {
        width: 468px !important;
        height: 30px !important;
        position: static !important;
      }
      .content_table_right .el-select .el-select__placeholder {
        width: 422px !important;
      }
      .content_table_right .el-select .el-select__placeholder span {
        color: rgb(168, 171, 178) !important;
        font-size: 14px !important;
      }
      /* ========== 修复结束 ========== */
    </style>
    <title>设备管理</title>
</head>
<body>
<noscript>
    <strong>We're sorry but 设备管理 doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
</noscript>
<div id="app">
  <div id="app-loading">
    <div class="spinner"></div>
    <div class="tip">系统加载中…</div>
  </div>
</div>
<script src="/config.js"></script>
<script>
// ========== el-select 占位符可见性 + 组织架构下拉框宽度修复 ==========
(function() {
  function fixSelects() {
    // 1. 占位符可见性修复
    var placeholders = document.querySelectorAll('.el-select__selected-item.el-select__placeholder');
    for (var i = 0; i < placeholders.length; i++) {
      var el = placeholders[i];
      el.style.setProperty('z-index', '1', 'important');
      el.style.setProperty('position', 'absolute', 'important');
      el.style.setProperty('opacity', '1', 'important');
      var span = el.querySelector('span');
      if (span) {
        span.style.setProperty('color', 'rgb(168, 171, 178)', 'important');
        span.style.setProperty('font-size', '14px', 'important');
      }
    }

    // 2. 组织架构页面下拉框宽度修复
    var contentRights = document.querySelectorAll('.content_table_right');
    for (var j = 0; j < contentRights.length; j++) {
      var selects = contentRights[j].querySelectorAll('.el-select');
      for (var k = 0; k < selects.length; k++) {
        var sel = selects[k];
        sel.style.setProperty('width', '468px', 'important');
        var wrapper = sel.querySelector('.el-select__wrapper');
        if (wrapper) {
          wrapper.style.setProperty('width', '468px', 'important');
          wrapper.style.setProperty('height', '30px', 'important');
          wrapper.style.setProperty('position', 'static', 'important');
        }
        var ph = sel.querySelector('.el-select__placeholder');
        if (ph) {
          ph.style.setProperty('width', '422px', 'important');
        }
      }
    }
  }

  setTimeout(fixSelects, 200);
  setTimeout(fixSelects, 800);
  setTimeout(fixSelects, 1500);
  setTimeout(fixSelects, 3000);

  if (typeof MutationObserver !== 'undefined') {
    var observer = new MutationObserver(function() { fixSelects(); });
    document.addEventListener('DOMContentLoaded', function() {
      observer.observe(document.body, { childList: true, subtree: true });
    });
  }
})();
// ========== 修复脚本结束 ==========
</script>
<script>
// 临时调试：捕获所有浏览器端错误并显示在页面上
window.onerror = function(msg, url, line, col, err) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:red;color:white;padding:10px;font-size:12px;word-break:break-all;';
  d.textContent = '[JS Error] ' + msg + ' at ' + url + ':' + line + ':' + col;
  document.body.appendChild(d);
};
window.onunhandledrejection = function(e) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:orange;color:white;padding:10px;font-size:12px;word-break:break-all;';
  d.textContent = '[Promise Error] ' + (e.reason && e.reason.message || e.reason);
  document.body.appendChild(d);
};
</script>
<!-- l7-mapbox scripts loaded on demand by map components -->
<script type="module" src="/src/main.js"></script>
</body>
</html>
