<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <meta content="lxy" name="author">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="yes" name="apple-mobile-web-app-capable"/>
    <meta content="no-cache, no-store, must-revalidate" http-equiv="content-type"/>
    <meta content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <style>html, body, #app {height: 100%;display: flex;flex-direction: column;}</style>
    <title>可视化组态</title>
    <link href="/favicon.ico" rel="icon">
    <script src="/meta2d/canvas2svg.min.js"></script>
</head>
<body>
<noscript>
    <strong>We're sorry but 可视化组态 doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
</noscript>
<div id="app"></div>
<script>
window.onerror = function(msg, url, line, col, err) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:red;color:white;padding:10px;font-size:12px;word-break:break-all;';
  d.textContent = '[JS Error] ' + msg + ' at ' + url + ':' + line + ':' + col;
  document.body.appendChild(d);
};
window.onunhandledrejection = function(e) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:orange;color:white;padding:10px;font-size:12px;word-break:break-all;';
  d.textContent = '[Promise Error] ' + (e.reason && e.reason.message || e.reason);
  document.body.appendChild(d);
};
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
