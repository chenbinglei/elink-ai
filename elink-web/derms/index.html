<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta content="HangZhou_ShengMan" name="author">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="mobile-web-app-capable" content="yes">
  <meta content="no-cache, no-store, must-revalidate" http-equiv="content-type" />

  <!-- Mapbox CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <!-- 解决数据可视化平台-地图的报错 -->
  <meta name="referrer" content="no-referrer" />
  <!-- Mapbox JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <meta content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    name="viewport" />
  <style>
    html,
    body,
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: rgba(0, 0, 0, 1);
    }
  </style>
  <title>综合能源聚合管理平台</title>
  <script type="module" src="/config.js"></script>
</head>

<body class="ui-design">
  <div id="app"></div>
  <script>
  window.onerror = function(msg, url, line, col, err) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:red;color:white;padding:10px;font-size:12px;word-break:break-all;';
    d.textContent = '[JS Error] ' + msg + ' at ' + url + ':' + line + ':' + col;
    document.body.appendChild(d);
  };
  window.onunhandledrejection = function(e) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:orange;color:white;padding:10px;font-size:12px;word-break:break-all;';
    d.textContent = '[Promise Error] ' + (e.reason && e.reason.message || e.reason);
    document.body.appendChild(d);
  };
  </script>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
