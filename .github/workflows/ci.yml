name: CI/CD Pipeline

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  MAVEN_OPTS: >-
    -Xmx1024m
    -Dhttps.protocols=TLSv1.2

jobs:
  # ──────────────────────────────────────────────
  # 后端：编译 + 测试 + 打包
  # ──────────────────────────────────────────────
  backend:
    name: Backend - Compile & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elink-work

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile
        run: mvn compile -T 4 -B -V

      - name: Run tests
        run: mvn test -T 4 -B
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Generate JaCoCo report
        run: mvn jacoco:prepare-agent test jacoco:report -T 4 -B
        continue-on-error: true

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: elink-work/**/target/site/jacoco/
          retention-days: 7

      - name: Package (skip tests)
        run: mvn package -DskipTests -T 4 -B

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: elink-work/**/target/*.jar
          retention-days: 3

  # ──────────────────────────────────────────────
  # 前端：Lint + Build（3个项目并行）
  # ──────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [linkos, derms, tycvs]

    defaults:
      run:
        working-directory: elink-web/${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: elink-web/${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  frontend-build:
    name: Frontend Build - ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: frontend-lint
    strategy:
      fail-fast: false
      matrix:
        project: [linkos, derms, tycvs]

    defaults:
      run:
        working-directory: elink-web/${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: elink-web/${{ matrix.project }}/package-lock.json

      - name: Setup environment
        run: npm run setup:env
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ matrix.project }}
          path: elink-web/${{ matrix.project }}/dist/
          retention-days: 3

  # ──────────────────────────────────────────────
  # Docker：构建镜像（仅 main 分支 push 触发）
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: elink-work/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image
        run: |
          docker build -t elink-base:latest -f elink-work/Dockerfile.base elink-work/
        continue-on-error: true

      - name: Build service images (dry-run)
        run: |
          echo "Docker image build verification - listing services:"
          grep -E '^\s+\S+-service:' elink-work/docker-compose.yml || true
          echo "Images would be built and pushed in production environment"

  # ──────────────────────────────────────────────
  # 部署：灰度部署到测试环境（仅 main 分支 push 触发）
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy (Grayscale)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /work/elink-ai/elink-work
            # 灰度部署：先部署单个核心服务验证
            ./hot-reload.sh reload auth-service skip
            sleep 30
            # 验证服务健康
            curl -sf http://localhost:60001/sauth/actuator/health || exit 1
            echo "Grayscale deploy auth-service: OK"
